# 오너 정보 — 비대화형 설치용
#
#   cp owner.example.conf owner.conf   (owner.conf 는 .gitignore 됨)
#   bash install.sh --answers owner.conf
#
# 비워두면 기본값이 들어갑니다. 나중에 ~/.claude/CLAUDE.md 에서 바꿔도 됩니다.
# ⚠ 이 파일에 비밀번호·API 키를 적지 마세요. 이름·경로만 받습니다.

# ---------- 사람 ----------
OWNER_NAME=오너                  # 이름 (예: 홍길동)
OWNER_TITLE=오너님               # 에이전트가 부를 호칭 (예: 길동님, 대표님)
OWNER_HANDLE=                    # GitHub 계정 (예: gildong)
OWNER_EMAIL=                     # 이메일
GITHUB_ORG=                      # GitHub 조직 (없으면 계정명)

# ---------- 경로 ----------
PROJECTS_ROOT=$HOME/projects     # 작업 루트
CODE_ROOT=$HOME/Code             # 도구·엔진 루트
VAULT_ROOT=$HOME/Documents/Vault # 지식 볼트(옵시디언 등). 안 쓰면 비워둠

# ---------- 에이전트 이름 ----------
# 안 정해도 됩니다. 비우면 직무명이 그대로 들어갑니다(개발·디자인 …).
# 이름을 붙이면 "누가 무엇을 맡는가"가 대화에서 또렷해집니다.
MODERATOR=조율자                 # 업무를 접수·배분·검수하는 역할
AGENT_MODERATOR=조율             # 〃 (에이전트로 부를 때)
AGENT_DEV=개발
AGENT_CORE=코어개발              # 근본원인·성능·시스템
AGENT_DESIGN=디자인
AGENT_MARKETING=마케팅
AGENT_CONTENT=콘텐츠
AGENT_EDU=교육
AGENT_SALES=영업재무
AGENT_PLANNING=기획
AGENT_RESEARCH=리서치
