<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Claude AI Kit hero</title>
<style>
  :root {
    --paper: #F7F4EE; --card: #FFFFFF; --line: #E6E0D6; --ink: #1B1A17;
    --sub: #6B655C; --faint: #A39C90; --accent: #D9622B; --accent-soft: #FBEDE4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 800px; }
  body {
    background: var(--paper);
    font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
    color: var(--ink); word-break: keep-all; overflow-wrap: break-word;
    display: grid; grid-template-columns: 1fr 640px; align-items: center;
    padding: 0 112px; gap: 72px; position: relative;
  }
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px; opacity: .35; pointer-events: none;
  }
  .left, .stack { position: relative; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px; height: 36px; padding: 0 16px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--card);
    font-size: 17px; font-weight: 600; color: var(--sub); white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  h1 { margin-top: 28px; font-size: 76px; font-weight: 800; letter-spacing: -2.5px; line-height: 1.05; }
  .tag { margin-top: 26px; font-size: 34px; font-weight: 700; letter-spacing: -.8px; line-height: 1.4; text-wrap: balance; }
  .tag em { font-style: normal; color: var(--accent); }
  .desc { margin-top: 20px; font-size: 20px; line-height: 1.65; color: var(--sub); max-width: 600px; text-wrap: pretty; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row {
    display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 16px;
    height: 70px; padding: 0 22px; border: 1px solid var(--line); border-radius: 18px;
    background: var(--card); box-shadow: 0 1px 2px rgba(27,26,23,.04);
  }
  .ico {
    width: 44px; height: 44px; border-radius: 12px; background: var(--paper);
    display: grid; place-items: center;
  }
  .ico svg { width: 22px; height: 22px; stroke: var(--ink); stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .name { font-size: 20px; font-weight: 700; white-space: nowrap; }
  .name small { margin-left: 8px; font-size: 15px; font-weight: 500; color: var(--faint); }
  .count { font-size: 26px; font-weight: 800; letter-spacing: -.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row.empty { background: transparent; border: 1.5px dashed #D3CBBE; box-shadow: none; }
  .row.empty .ico { background: var(--accent-soft); }
  .row.empty .ico svg { stroke: var(--accent); }
  .row.empty .name { color: var(--sub); }
  .row.empty .count { font-size: 17px; font-weight: 700; color: var(--accent); }
</style>
</head>
<body>
  <div class="left">
    <span class="eyebrow"><span class="dot"></span>Claude Code 작업 환경 패키지</span>
    <h1>Claude AI Kit</h1>
    <p class="tag">도구는 한 벌로 챙기고,<br><em>일하는 규칙은 당신이 정합니다.</em></p>
    <p class="desc">스킬·플러그인·MCP를 새 PC에 한 번에 세웁니다.<br>사람 이름도, 남의 규칙도 들어 있지 않습니다.</p>
  </div>
  <div class="stack">
    <div class="row"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg></span><span class="name">스킬<small>skills</small></span><span class="count">131</span></div>
    <div class="row"><span class="ico"><svg viewBox="0 0 24 24"><path d="M5 8l4 4-4 4M12 16h7"/></svg></span><span class="name">커맨드<small>commands</small></span><span class="count">42</span></div>
    <div class="row"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 3.8-5.5 7-5.5s5.8 1.9 7 5.5"/></svg></span><span class="name">에이전트<small>agents</small></span><span class="count">23</span></div>
    <div class="row"><span class="ico"><svg viewBox="0 0 24 24"><path d="M9 3v4M15 3v4M7 7h10v4a5 5 0 01-10 0zM12 16v5"/></svg></span><span class="name">플러그인<small>plugins</small></span><span class="count">21</span></div>
    <div class="row"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="6" rx="2"/><rect x="3.5" y="14" width="17" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg></span><span class="name">MCP 서버<small>mcp</small></span><span class="count">14</span></div>
    <div class="row"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></svg></span><span class="name">출력 스타일 · 셸<small>styles · shell</small></span><span class="count">2 + 1</span></div>
    <div class="row empty"><span class="ico"><svg viewBox="0 0 24 24"><path d="M6 4h9l3 3v13H6z"/><path d="M9 12h6M9 16h4"/></svg></span><span class="name">일하는 규칙<small>CLAUDE.md</small></span><span class="count">비워 둠</span></div>
  </div>
</body>
</html>
